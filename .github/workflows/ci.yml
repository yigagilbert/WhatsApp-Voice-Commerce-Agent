name: CI

# Lint, format, types, unit tests, integration tests (real Postgres, simulated PayPal and LLM) and
# the production build, on every pull request and push to main. Real-LLM / PayPal Sandbox suites
# (test:external) need secrets and stay manual.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vca
          POSTGRES_PASSWORD: vca
          POSTGRES_DB: vca
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vca" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # CI-only values: a throwaway database and placeholder tokens (no real credentials).
      DATABASE_URL: postgresql://vca:vca@localhost:5432/vca?schema=public
      NODE_ENV: test
      API_BASE_URL: http://localhost:4000
      API_AUTH_TOKEN: ci-dashboard-token-123456
      INTERNAL_SERVICE_TOKEN: ci-internal-token-123456
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:deploy
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build
