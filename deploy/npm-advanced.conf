# Nginx Proxy Manager → Proxy Host (katale) → "Advanced" tab → Custom Nginx Configuration.
# The Details tab forwards everything else to katale-web:3000 (the dashboard).
# Only these API paths are public; all other /api/* routes stay internal (404).
# `auth_basic off` keeps PayPal callbacks working if an Access List protects the dashboard.
# The upstream is a variable so nginx re-resolves katale-api through NPM's Docker resolver
# (127.0.0.11, valid=10s) — a literal name is resolved once at load and breaks when a redeploy
# gives the API container a new IP (seen 2026-10-17: 502 until nginx reloaded).

location /api/paypal/ {
    auth_basic off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    set $katale_api katale-api;
    proxy_pass http://$katale_api:4000;
}

location = /api/health {
    auth_basic off;
    proxy_set_header Host $host;
    set $katale_api katale-api;
    proxy_pass http://$katale_api:4000;
}

location /api/ {
    return 404;
}
